name: GML Checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-gml:
    name: Lint GML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run GML syntax & structural checks
        run: bash ci/check_gml.sh

      - name: Run GML parser diagnostics
        run: node ci/check_gml.mjs
